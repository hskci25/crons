<body class="flex flex-col items-center justify-center min-h-screen selection:bg-primary-container selection:text-background">

<div class="relative z-10 space-y-8 text-center">
<div class="space-y-2">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">

<p class="font-body-md text-body-md text-on-surface-variant opacity-70">

                    </p>
</div>

<!-- Interactive Atmosphere Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            
            const technicalPattern = document.querySelector('.technical-pattern');
            if (technicalPattern) {
                technicalPattern.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.02)`;
            }
        });

        // Simple button press interaction
        const btn = document.querySelector('button');
        btn.addEventListener('click', () => {
            btn.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></span>
                    <span>Redirecting...</span>
                </div>
            `;
            btn.style.opacity = '0.8';
            btn.disabled = true;
        });
    </script>
